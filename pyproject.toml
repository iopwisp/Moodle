[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doneasik-lab-agent"
version = "0.2.0"
description = "A local, evidence-oriented workflow assistant for university lab assignments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
documents = ["python-docx>=1.1", "pypdf>=5.0", "reportlab>=4.2", "Pillow>=10.0"]
gui = ["pyautogui>=0.9.54", "pygetwindow>=0.0.9", "pywinauto>=0.6.8", "PyYAML>=6.0"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
browser = ["playwright>=1.49"]
all = ["doneasik-lab-agent[documents,gui,web,browser,dev]"]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
lab-agent = "lab_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
