[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doneasik-lab-agent"
version = "0.3.0"
description = "A local, evidence-oriented agent that executes and verifies university lab assignments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "PyYAML>=6.0"]

[project.optional-dependencies]
documents = ["python-docx>=1.1", "pypdf>=5.0", "reportlab>=4.2", "Pillow>=10.0"]
gui = ["pyautogui>=0.9.54", "pygetwindow>=0.0.9", "pywinauto>=0.6.8", "Pillow>=10.0"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
browser = ["playwright>=1.49"]
secrets = ["keyring>=24"]
all = ["doneasik-lab-agent[documents,gui,web,browser,secrets,dev]"]
dev = ["pytest>=8.0", "ruff>=0.16,<0.17", "httpx>=0.27", "mypy>=1.10", "types-PyYAML>=6.0"]

[project.scripts]
lab-agent = "lab_agent.cli:main"

# Third-party integrations register here, e.g.
# [project.entry-points."doneasik_lab_agent.integrations"]
# my_tool = "my_package.lab_plugin:create_adapters"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:.*httpx.*:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF012", "ISC004"]

[tool.mypy]
python_version = "3.12"
files = ["src/lab_agent"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
disallow_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
