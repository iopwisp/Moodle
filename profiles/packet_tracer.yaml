name: packet_tracer
display_name: Cisco Packet Tracer
status: executable_profile
executable_env: LAB_AGENT_PACKET_TRACER_PATH
# Verified on Packet Tracer 8.2.2 / Windows 11: main window class CAppWindow; the account
# login is a separate window (class CNetspaceLogin) whose content is an embedded web view.
window: {class_name: CAppWindow}
launch_wait_seconds: 5
window_timeout_seconds: 120
ready_settle_seconds: 2
command_delay_seconds: 0.4
output_settle_seconds: 1.0
ping_timeout_seconds: 60   # a ping in realtime mode takes 20-35 s (4 echoes)
ping_poll_seconds: 2

# Dialogs that stop automation and need the student (human-in-the-loop).
blockers:
  - window: {any: [{class_name: CNetspaceLogin}, {title_re: "(?i)(skills ?for ?all|networking academy|packet tracer login|sign in)"}]}
    reason: "Packet Tracer requires a Cisco account login. Log in once in the open window, then resume the run."

# Pop-ups the computer-use loop may close.
dismiss:
  - window: {title_re: "(?i)(update|what's new)"}
    control: {title_re: "(?i)^(later|no|close|ok)$", control_type: Button}

# How to reach the text consoles inside a device window (title = device name).
device_tabs:
  CLI: {title: CLI, control_type: TabItem}
  Command Prompt:
    - {title: Desktop, control_type: TabItem}
    - {title_re: '^Command\s+Prompt$'}  # PT 8.2.2 names the Desktop button "Command<newline>Prompt"
console: {any: [{control_type: Edit}, {control_type: Document}]}

operations:
  launch: []
  save_as:
    - {type: hotkey, keys: "^+s"}
    - {type: wait_until, window: {title_re: "(?i)save"}, timeout: 15}
    - {type: type, window: {title_re: "(?i)save"}, control: {control_type: Edit, found_index: 0}, text: "{path}"}
    - {type: hotkey, keys: "{ENTER}"}
    - {type: wait, seconds: 2}

verification: {}

versions:
  "8":
    notes: "Packet Tracer 8.x (Qt). Device windows are top-level windows titled with the device name."

notes: >
  The logical canvas has no accessibility controls; integrations/pt_canvas.py and pt_sim.py drive it with clicks and
  keys posted to Packet Tracer's windows (no focus, no real mouse) and confirm every result through UI Automation:
  device windows, port menus, the Simulation Panel Event List and the Workspace List. The IOS CLI tab still types
  with the real keyboard. Selectors were recorded on Packet Tracer 8.2.2; confirm them on other versions.

# Canvas automation (integrations/pt_canvas.py). Device-type panel buttons are found through UI Automation by these
# names (class CDeviceButton); recorded from Packet Tracer 8.2.2 on 2026-10-05.
