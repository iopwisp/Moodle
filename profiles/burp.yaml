name: burp
display_name: Burp Suite
status: executable_profile
executable_env: LAB_AGENT_BURP_PATH
window: {title_re: "Burp Suite"}
window_title_re: ".*Burp Suite.*"
launch_wait_seconds: 8
window_timeout_seconds: 180
ready_settle_seconds: 3
launcher_exits: false
scope: local_labs_or_explicitly_authorized_targets_only

blockers:
  - window: {title_re: "(?i)licen[cs]e"}
    reason: "Burp Suite shows a licence dialog; accept it once manually, then resume."

dismiss:
  - window: {title_re: "(?i)(update|new version)"}
    control: {title_re: "(?i)^(later|close|not now)$"}

operations:
  launch: []
  # Burp is a Java Swing application: UI Automation needs the Java Access Bridge
  # (run `jabswitch -enable` with Burp's bundled JRE once). Keyboard shortcuts below
  # are Burp defaults; adjust them in Settings > User interface > Hotkeys if changed.
  # Start-up wizard (Temporary project -> Next -> Use Burp defaults -> Start Burp). The wizard is Swing and
  # invisible to UI Automation, but its default buttons answer Enter. Run only while the proxy is not up yet.
  # Verified on Burp Suite Community 2026.8: the proxy listens about a second after the second Enter.
  start_temporary_project:
    - {type: focus_window}
    - {type: wait, seconds: 1}
    - {type: hotkey, keys: "{{ENTER}}"}  # {{ }} escapes the template braces
    - {type: wait, seconds: 3}
    - {type: focus_window}
    - {type: hotkey, keys: "{{ENTER}}"}  # {{ }} escapes the template braces
  intercept_on:
    - {type: focus_window}
    - {type: hotkey, keys: "^+p"}
    - {type: wait, seconds: 1}
    - {type: hotkey, keys: "^t"}
  forward:
    - {type: focus_window}
    - {type: hotkey, keys: "^f"}
    - {type: wait, seconds: 1}
  intercept_off:
    - {type: focus_window}
    - {type: hotkey, keys: "^+p"}
    - {type: wait, seconds: 1}
    - {type: hotkey, keys: "^t"}
  send_to_repeater:
    - {type: focus_window}
    - {type: hotkey, keys: "^r"}
    - {type: wait, seconds: 1}
    - {type: hotkey, keys: "^+r"}

verification:
  launch:
    - {type: window_exists, title_re: "Burp Suite"}

notes: >
  Proxy behaviour is verified through the network (listener on 127.0.0.1:8080, http://burp/ page, held requests),
  not through the GUI. Use Burp only with local, intentionally vulnerable or explicitly authorized targets.
