name: autopsy
display_name: Autopsy
status: executable_profile
executable_env: LAB_AGENT_AUTOPSY_PATH
window: {title_re: "Autopsy"}
window_title_re: ".*Autopsy.*"
launch_wait_seconds: 4
window_timeout_seconds: 180
ready_settle_seconds: 3

supported_workflow:
  - create_case
  - add_data_source
  - configure_ingest
  - start_ingest
  - wait_for_completion
  - inspect_results
  - search_artifacts
  - export_artifact
  - capture_evidence
  - e2e

dismiss:
  - window: {title_re: "(?i)welcome"}
    control: {title_re: "(?i)^close$", control_type: Button}

operations:
  launch: []
  capture_evidence:
    - {type: focus_window}
    - {type: wait, seconds: 1}

goals:
  close_welcome:
    description: "Close the Welcome dialog so the case tree is visible"
    steps:
      - name: close welcome
        action: click
        targets: [{title: Close, control_type: Button}]
        done_when: {window_absent: {title_re: "(?i)welcome"}}

verification:
  capture_evidence:
    - {type: window_exists, title_re: "Autopsy"}

notes:
  command_line_ingest:
    - "--createCase --caseName=<name> --caseBaseDir=<dir>"
    # An existing case is opened by its parent folder and name; --caseDir is rejected
    # ("Unrecognized option", verified on Autopsy 4.23.1).
    - "--caseBaseDir=<case parent> --caseName=<name> --addDataSource --dataSourcePath=<image>"
    - "--caseBaseDir=<case parent> --caseName=<name> --runIngest --dataSourceObjectId=<id> [--ingestProfile=<profile>]"
    - "--caseBaseDir=<case parent> --caseName=<name> --generateReports"
  verification: "Results are verified by reading autopsy.db (data_source_info, ingest_jobs, tsk_files, blackboard_artifacts)."
  source: "Autopsy user documentation: Command Line Ingest."
